# Rule configuration for the bug detector. Loaded and validated by ml/rule_loader.py.
#
# Per rule: id, severity (HIGH/MEDIUM/LOW), category, message, fix, and `languages`.
# Each language lists how the rule is detected:
#   ast         Python structural check (name + parameters, see ml/python_ast.py)
#   query       tree-sitter query for javascript/java/cpp; mark the offending node @hit
#   sql         sqlparse check for sql (see ml/sql_engine.py)
#   regex       regular expression; used on its own, or as the fallback when the code
#               cannot be parsed (view: masked | code | comments, flags, multiline)
#   text_check  named line-based check, used as a fallback
# To add a rule: append an entry here and a test in tests/. No Python changes needed
# unless it needs a new named check.

version: 1
rules:
  - id: 1
    severity: HIGH
    category: Security
    message: eval() is dangerous — can execute any code injected by user!
    fix: Remove eval(). Use ast.literal_eval() in Python or JSON.parse() in JavaScript.
    languages:
      javascript:
        query: |
          (call_expression function: (identifier) @hit (#eq? @hit "eval"))
        regex: (?<![\w.])eval\s*\(
      python:
        ast:
          check: calls
          names:
          - eval
        regex: (?<![\w.])eval\s*\(
  - id: 2
    severity: HIGH
    category: Security
    message: exec() is a serious security risk — executes arbitrary code!
    fix: Remove exec(). Use proper function calls or logic instead.
    languages:
      python:
        ast:
          check: calls
          names:
          - exec
        regex: (?<![\w.])exec\s*\(
  - id: 3
    severity: HIGH
    category: Security
    message: Hardcoded password detected — never store passwords in code!
    fix: 'Use environment variables: import os; password = os.environ.get(''PASSWORD'')'
    languages:
      cpp:
        query: |
          (init_declarator declarator: [(identifier) @n (array_declarator declarator: (identifier) @n)] value: (string_literal (string_content)) (#match? @n "(?i)password|passwd|pwd")) @hit
          (assignment_expression left: (identifier) @n right: (string_literal (string_content)) (#match? @n "(?i)password|passwd|pwd")) @hit
        regex: (?<![\"'\w])\w*(?:password|passwd|pwd)\w*\s*(?:\[\s*\d*\s*\])?\s*[:=]\s*[\"'][^\"'\n]+[\"']|[\"'][\w-]*(?:password|passwd|pwd)[\w-]*[\"']\s*:\s*[\"'][^\"'\n]+[\"']
        flags:
        - IGNORECASE
        view: code
      java:
        query: |
          (variable_declarator name: (identifier) @n value: (string_literal (string_fragment)) (#match? @n "(?i)password|passwd|pwd")) @hit
          (assignment_expression left: (identifier) @n right: (string_literal (string_fragment)) (#match? @n "(?i)password|passwd|pwd")) @hit
        regex: (?<![\"'\w])\w*(?:password|passwd|pwd)\w*\s*(?:\[\s*\d*\s*\])?\s*[:=]\s*[\"'][^\"'\n]+[\"']|[\"'][\w-]*(?:password|passwd|pwd)[\w-]*[\"']\s*:\s*[\"'][^\"'\n]+[\"']
        flags:
        - IGNORECASE
        view: code
      javascript:
        query: |
          (variable_declarator name: (identifier) @n value: (string (string_fragment)) (#match? @n "(?i)password|passwd|pwd")) @hit
          (assignment_expression left: (identifier) @n right: (string (string_fragment)) (#match? @n "(?i)password|passwd|pwd")) @hit
          (assignment_expression left: (member_expression property: (property_identifier) @n) right: (string (string_fragment)) (#match? @n "(?i)password|passwd|pwd")) @hit
          (pair key: (property_identifier) @n value: (string (string_fragment)) (#match? @n "(?i)password|passwd|pwd")) @hit
          (pair key: (string (string_fragment) @n) value: (string (string_fragment)) (#match? @n "(?i)password|passwd|pwd")) @hit
        regex: (?<![\"'\w])\w*(?:password|passwd|pwd)\w*\s*(?:\[\s*\d*\s*\])?\s*[:=]\s*[\"'][^\"'\n]+[\"']|[\"'][\w-]*(?:password|passwd|pwd)[\w-]*[\"']\s*:\s*[\"'][^\"'\n]+[\"']
        flags:
        - IGNORECASE
        view: code
      python:
        ast:
          check: hardcoded_secret
          pattern: (?i)password|passwd|pwd
        regex: (?<![\"'\w])\w*(?:password|passwd|pwd)\w*\s*(?:\[\s*\d*\s*\])?\s*[:=]\s*[\"'][^\"'\n]+[\"']|[\"'][\w-]*(?:password|passwd|pwd)[\w-]*[\"']\s*:\s*[\"'][^\"'\n]+[\"']
        flags:
        - IGNORECASE
        view: code
      sql:
        regex: (?<![\"'\w])\w*(?:password|passwd|pwd)\w*\s*(?:\[\s*\d*\s*\])?\s*[:=]\s*[\"'][^\"'\n]+[\"']|[\"'][\w-]*(?:password|passwd|pwd)[\w-]*[\"']\s*:\s*[\"'][^\"'\n]+[\"']
        flags:
        - IGNORECASE
        view: code
  - id: 4
    severity: HIGH
    category: Security
    message: Hardcoded secret detected — store secrets in environment variables!
    fix: 'Use: import os; secret = os.environ.get(''SECRET_KEY'')'
    languages:
      cpp:
        query: |
          (init_declarator declarator: [(identifier) @n (array_declarator declarator: (identifier) @n)] value: (string_literal (string_content)) (#match? @n "(?i)secret|private_?key")) @hit
          (assignment_expression left: (identifier) @n right: (string_literal (string_content)) (#match? @n "(?i)secret|private_?key")) @hit
        regex: (?<![\"'\w])\w*(?:secret|private_?key)\w*\s*(?:\[\s*\d*\s*\])?\s*[:=]\s*[\"'][^\"'\n]+[\"']|[\"'][\w-]*(?:secret|private_?key)[\w-]*[\"']\s*:\s*[\"'][^\"'\n]+[\"']
        flags:
        - IGNORECASE
        view: code
      java:
        query: |
          (variable_declarator name: (identifier) @n value: (string_literal (string_fragment)) (#match? @n "(?i)secret|private_?key")) @hit
          (assignment_expression left: (identifier) @n right: (string_literal (string_fragment)) (#match? @n "(?i)secret|private_?key")) @hit
        regex: (?<![\"'\w])\w*(?:secret|private_?key)\w*\s*(?:\[\s*\d*\s*\])?\s*[:=]\s*[\"'][^\"'\n]+[\"']|[\"'][\w-]*(?:secret|private_?key)[\w-]*[\"']\s*:\s*[\"'][^\"'\n]+[\"']
        flags:
        - IGNORECASE
        view: code
      javascript:
        query: |
          (variable_declarator name: (identifier) @n value: (string (string_fragment)) (#match? @n "(?i)secret|private_?key")) @hit
          (assignment_expression left: (identifier) @n right: (string (string_fragment)) (#match? @n "(?i)secret|private_?key")) @hit
          (assignment_expression left: (member_expression property: (property_identifier) @n) right: (string (string_fragment)) (#match? @n "(?i)secret|private_?key")) @hit
          (pair key: (property_identifier) @n value: (string (string_fragment)) (#match? @n "(?i)secret|private_?key")) @hit
          (pair key: (string (string_fragment) @n) value: (string (string_fragment)) (#match? @n "(?i)secret|private_?key")) @hit
        regex: (?<![\"'\w])\w*(?:secret|private_?key)\w*\s*(?:\[\s*\d*\s*\])?\s*[:=]\s*[\"'][^\"'\n]+[\"']|[\"'][\w-]*(?:secret|private_?key)[\w-]*[\"']\s*:\s*[\"'][^\"'\n]+[\"']
        flags:
        - IGNORECASE
        view: code
      python:
        ast:
          check: hardcoded_secret
          pattern: (?i)secret|private_?key
        regex: (?<![\"'\w])\w*(?:secret|private_?key)\w*\s*(?:\[\s*\d*\s*\])?\s*[:=]\s*[\"'][^\"'\n]+[\"']|[\"'][\w-]*(?:secret|private_?key)[\w-]*[\"']\s*:\s*[\"'][^\"'\n]+[\"']
        flags:
        - IGNORECASE
        view: code
      sql:
        regex: (?<![\"'\w])\w*(?:secret|private_?key)\w*\s*(?:\[\s*\d*\s*\])?\s*[:=]\s*[\"'][^\"'\n]+[\"']|[\"'][\w-]*(?:secret|private_?key)[\w-]*[\"']\s*:\s*[\"'][^\"'\n]+[\"']
        flags:
        - IGNORECASE
        view: code
  - id: 5
    severity: HIGH
    category: Security
    message: Hardcoded API key or token in code — this is a security vulnerability!
    fix: 'Use: api_key = os.environ.get(''API_KEY'') and keep the value in a .env file'
    languages:
      cpp:
        query: |
          (init_declarator declarator: [(identifier) @n (array_declarator declarator: (identifier) @n)] value: (string_literal (string_content)) (#match? @n "(?i)api[_-]?key|access_?token|auth_?token|bearer_?token")) @hit
          (assignment_expression left: (identifier) @n right: (string_literal (string_content)) (#match? @n "(?i)api[_-]?key|access_?token|auth_?token|bearer_?token")) @hit
        regex: (?<![\"'\w])\w*(?:api[_-]?key|access_?token|auth_?token|bearer_?token)\w*\s*(?:\[\s*\d*\s*\])?\s*[:=]\s*[\"'][^\"'\n]+[\"']|[\"'][\w-]*(?:api[_-]?key|access_?token|auth_?token|bearer_?token)[\w-]*[\"']\s*:\s*[\"'][^\"'\n]+[\"']
        flags:
        - IGNORECASE
        view: code
      java:
        query: |
          (variable_declarator name: (identifier) @n value: (string_literal (string_fragment)) (#match? @n "(?i)api[_-]?key|access_?token|auth_?token|bearer_?token")) @hit
          (assignment_expression left: (identifier) @n right: (string_literal (string_fragment)) (#match? @n "(?i)api[_-]?key|access_?token|auth_?token|bearer_?token")) @hit
        regex: (?<![\"'\w])\w*(?:api[_-]?key|access_?token|auth_?token|bearer_?token)\w*\s*(?:\[\s*\d*\s*\])?\s*[:=]\s*[\"'][^\"'\n]+[\"']|[\"'][\w-]*(?:api[_-]?key|access_?token|auth_?token|bearer_?token)[\w-]*[\"']\s*:\s*[\"'][^\"'\n]+[\"']
        flags:
        - IGNORECASE
        view: code
      javascript:
        query: |
          (variable_declarator name: (identifier) @n value: (string (string_fragment)) (#match? @n "(?i)api[_-]?key|access_?token|auth_?token|bearer_?token")) @hit
          (assignment_expression left: (identifier) @n right: (string (string_fragment)) (#match? @n "(?i)api[_-]?key|access_?token|auth_?token|bearer_?token")) @hit
          (assignment_expression left: (member_expression property: (property_identifier) @n) right: (string (string_fragment)) (#match? @n "(?i)api[_-]?key|access_?token|auth_?token|bearer_?token")) @hit
          (pair key: (property_identifier) @n value: (string (string_fragment)) (#match? @n "(?i)api[_-]?key|access_?token|auth_?token|bearer_?token")) @hit
          (pair key: (string (string_fragment) @n) value: (string (string_fragment)) (#match? @n "(?i)api[_-]?key|access_?token|auth_?token|bearer_?token")) @hit
        regex: (?<![\"'\w])\w*(?:api[_-]?key|access_?token|auth_?token|bearer_?token)\w*\s*(?:\[\s*\d*\s*\])?\s*[:=]\s*[\"'][^\"'\n]+[\"']|[\"'][\w-]*(?:api[_-]?key|access_?token|auth_?token|bearer_?token)[\w-]*[\"']\s*:\s*[\"'][^\"'\n]+[\"']
        flags:
        - IGNORECASE
        view: code
      python:
        ast:
          check: hardcoded_secret
          pattern: (?i)api[_-]?key|access_?token|auth_?token|bearer_?token
        regex: (?<![\"'\w])\w*(?:api[_-]?key|access_?token|auth_?token|bearer_?token)\w*\s*(?:\[\s*\d*\s*\])?\s*[:=]\s*[\"'][^\"'\n]+[\"']|[\"'][\w-]*(?:api[_-]?key|access_?token|auth_?token|bearer_?token)[\w-]*[\"']\s*:\s*[\"'][^\"'\n]+[\"']
        flags:
        - IGNORECASE
        view: code
      sql:
        regex: (?<![\"'\w])\w*(?:api[_-]?key|access_?token|auth_?token|bearer_?token)\w*\s*(?:\[\s*\d*\s*\])?\s*[:=]\s*[\"'][^\"'\n]+[\"']|[\"'][\w-]*(?:api[_-]?key|access_?token|auth_?token|bearer_?token)[\w-]*[\"']\s*:\s*[\"'][^\"'\n]+[\"']
        flags:
        - IGNORECASE
        view: code
  - id: 6
    severity: HIGH
    category: Security
    message: pickle.load() can execute malicious code from untrusted files!
    fix: Use json.load() for safe data loading instead of pickle.
    languages:
      python:
        ast:
          check: calls
          names:
          - pickle.load
          - pickle.loads
          - cPickle.load
          - cPickle.loads
        regex: \bpickle\.loads?\s*\(
  - id: 7
    severity: HIGH
    category: Security
    message: subprocess with shell=True allows command injection attacks!
    fix: 'Use shell=False and pass the command as a list: subprocess.run([''ls'', ''-la''])'
    languages:
      python:
        ast:
          check: calls
          names:
          - subprocess.run
          - subprocess.call
          - subprocess.Popen
          - subprocess.check_output
          - subprocess.check_call
          keywords:
            shell: true
        regex: \bshell\s*=\s*True\b
  - id: 8
    severity: HIGH
    category: Security
    message: Dynamic import with __import__() can be a security risk!
    fix: Use importlib.import_module() or regular static imports instead.
    languages:
      python:
        ast:
          check: calls
          names:
          - __import__
        regex: (?<![\w.])__import__\s*\(
  - id: 9
    severity: MEDIUM
    category: Bug
    message: 'Bare except: catches everything including system exits — too broad!'
    fix: 'Catch specific exceptions: except ValueError: or except TypeError:'
    languages:
      python:
        ast:
          check: bare_except
        regex: '^\s*except\s*:'
  - id: 10
    severity: LOW
    category: Bug
    message: Too broad exception — catches almost every error, hides real bugs
    fix: 'Catch the specific exception you expect, e.g. except ZeroDivisionError:'
    languages:
      python:
        ast:
          check: broad_except
        regex: '^\s*except\s+Exception\s*(?:as\s+\w+)?\s*:'
  - id: 11
    severity: MEDIUM
    category: Bug
    message: File opened without 'with' — file may not close properly on error!
    fix: 'Use: with open(''file.txt'', ''r'') as f:  — this closes the file automatically'
    languages:
      python:
        ast:
          check: open_without_with
        regex: ^(?!\s*(?:async\s+)?(?:with|def)\b).*?(?<![\w.])open\s*\(
  - id: 12
    severity: MEDIUM
    category: Best Practice
    message: Global variable usage — makes code hard to test and debug
    fix: Pass the variable as a function parameter instead of using global.
    languages:
      python:
        ast:
          check: global_statement
        regex: ^\s*global\s+\w
  - id: 13
    severity: MEDIUM
    category: Bug
    message: Infinite loop with no break, return or raise — it will never stop!
    fix: 'Add a break condition or use a proper loop condition: while count < limit:'
    languages:
      python:
        ast:
          check: infinite_loop
        regex: '^\s*while\s+(?:True|1)\s*:'
        needs_no_exit: true
  - id: 14
    severity: MEDIUM
    category: Performance
    message: time.sleep() blocks the entire program — bad for performance!
    fix: Consider async/await or threading for non-blocking delays.
    languages:
      python:
        ast:
          check: calls
          names:
          - time.sleep
        regex: \btime\.sleep\s*\(
  - id: 15
    severity: MEDIUM
    category: Bug
    message: assert is disabled in optimized Python (-O flag) — not safe for validation!
    fix: 'Use: if not condition: raise ValueError(''message'') instead of assert'
    languages:
      python:
        ast:
          check: assert_statement
        regex: ^\s*assert\b
  - id: 16
    severity: MEDIUM
    category: Best Practice
    message: Wildcard import pollutes the namespace and causes name conflicts!
    fix: 'Import only what you need: from math import sqrt, pi'
    languages:
      java:
        query: |
          (import_declaration (asterisk)) @hit
        regex: ^\s*import\s+(?:static\s+)?[\w.]+\.\*\s*;
      python:
        ast:
          check: wildcard_import
        regex: ^\s*from\s+[\w.]+\s+import\s+\*
  - id: 17
    severity: MEDIUM
    category: Security
    message: User input used directly — always validate before processing!
    fix: 'Validate input: val = input(''Enter: ''); if not val.isdigit(): raise ValueError'
    languages:
      python:
        ast:
          check: calls
          names:
          - input
          not_parent_names:
          - int
          - float
        regex: (?<![\w.])(?<!int\()(?<!float\()input\s*\(
  - id: 18
    severity: HIGH
    category: Bug
    message: Division by zero detected — this will crash your program!
    fix: 'Add a check: if divisor != 0: result = num / divisor'
    languages:
      cpp:
        query: |
          (binary_expression operator: "/" right: (number_literal) @hit (#match? @hit "^0$"))
        regex: '[\w)\]]\s*//?\s*0(?:\.0*)?(?![\w.])'
      java:
        query: |
          (binary_expression operator: "/" right: (decimal_integer_literal) @hit (#eq? @hit "0"))
        regex: '[\w)\]]\s*//?\s*0(?:\.0*)?(?![\w.])'
      javascript:
        query: |
          (binary_expression operator: "/" right: (number) @hit (#match? @hit "^0([.]0*)?$"))
        regex: '[\w)\]]\s*//?\s*0(?:\.0*)?(?![\w.])'
      python:
        ast:
          check: divide_by_zero
        regex: '[\w)\]]\s*//?\s*0(?:\.0*)?(?![\w.])'
      sql:
        regex: '[\w)\]]\s*//?\s*0(?:\.0*)?(?![\w.])'
  - id: 19
    severity: MEDIUM
    category: Bug
    message: Direct int(input()) will crash if the user types a non-number!
    fix: 'Wrap in try-except: try: val = int(input(''Enter: '')) except ValueError: print(''Not a number!'')'
    languages:
      python:
        ast:
          check: calls
          names:
          - input
          parent_names:
          - int
        regex: \bint\s*\(\s*input\s*\(
  - id: 20
    severity: MEDIUM
    category: Bug
    message: Direct float(input()) crashes on non-numeric input!
    fix: 'Wrap in try-except: try: val = float(input()) except ValueError: ...'
    languages:
      python:
        ast:
          check: calls
          names:
          - input
          parent_names:
          - float
        regex: \bfloat\s*\(\s*input\s*\(
  - id: 21
    severity: LOW
    category: Best Practice
    message: Comparing to None with ==/!= — use an identity check instead
    fix: Replace 'x == None' with 'x is None' (and '!=' with 'is not')
    languages:
      python:
        ast:
          check: compare_constant
          value: none
        regex: '[=!]=\s*None\b'
  - id: 22
    severity: LOW
    category: Best Practice
    message: Comparing to True with ==/!= is redundant — use the boolean value directly
    fix: Replace 'if x == True:' with 'if x:'
    languages:
      python:
        ast:
          check: compare_constant
          value: 'true'
        regex: '[=!]=\s*True\b'
  - id: 23
    severity: LOW
    category: Best Practice
    message: Comparing to False with ==/!= is redundant — use 'not' instead
    fix: Replace 'if x == False:' with 'if not x:'
    languages:
      python:
        ast:
          check: compare_constant
          value: 'false'
        regex: '[=!]=\s*False\b'
  - id: 24
    severity: LOW
    category: Best Practice
    message: print() in code — use the logging module for production output
    fix: 'Use: import logging; logging.info(''message'') instead of print()'
    languages:
      python:
        ast:
          check: calls
          names:
          - print
        regex: (?<![\w.])print\s*\(
  - id: 25
    severity: LOW
    category: Code Quality
    message: TODO/FIXME comment found — incomplete code!
    fix: Complete the TODO before submitting or deploying code.
    languages:
      cpp:
        regex: \b(?:TODO|FIXME|XXX)\b
        view: comments
      java:
        regex: \b(?:TODO|FIXME|XXX)\b
        view: comments
      javascript:
        regex: \b(?:TODO|FIXME|XXX)\b
        view: comments
      python:
        regex: \b(?:TODO|FIXME|XXX)\b
        view: comments
      sql:
        regex: \b(?:TODO|FIXME|XXX)\b
        view: comments
  - id: 26
    severity: LOW
    category: Code Quality
    message: Empty 'pass' block — is this intentional? Empty blocks can hide bugs
    fix: Add proper logic or raise NotImplementedError('Not implemented yet')
    languages:
      python:
        ast:
          check: empty_block
        regex: (?:^|:)\s*pass\s*$
  - id: 27
    severity: LOW
    category: Best Practice
    message: range(len(list)) is not Pythonic — use enumerate() instead
    fix: 'Replace with: for i, item in enumerate(my_list):'
    languages:
      python:
        ast:
          check: range_len
        regex: \brange\s*\(\s*len\s*\(
  - id: 28
    severity: LOW
    category: Best Practice
    message: Use the shorthand operator — x += 1 is cleaner
    fix: Replace 'x = x + 1' with 'x += 1'
    languages:
      cpp:
        query: |
          (assignment_expression left: (identifier) @l right: (binary_expression left: (identifier) @l2 operator: ["+" "-"] right: (number_literal)) (#eq? @l @l2)) @hit
        regex: \b([A-Za-z_]\w*)\s*=\s*\1\s*\+\s*\d+\s*;?\s*$
      java:
        query: |
          (assignment_expression left: (identifier) @l right: (binary_expression left: (identifier) @l2 operator: ["+" "-"] right: (decimal_integer_literal)) (#eq? @l @l2)) @hit
        regex: \b([A-Za-z_]\w*)\s*=\s*\1\s*\+\s*\d+\s*;?\s*$
      javascript:
        query: |
          (assignment_expression left: (identifier) @l right: (binary_expression left: (identifier) @l2 operator: ["+" "-"] right: (number)) (#eq? @l @l2)) @hit
        regex: \b([A-Za-z_]\w*)\s*=\s*\1\s*\+\s*\d+\s*;?\s*$
      python:
        ast:
          check: shorthand_operator
        regex: \b([A-Za-z_]\w*)\s*=\s*\1\s*\+\s*\d+\s*;?\s*$
  - id: 29
    severity: LOW
    category: Best Practice
    message: Avoid 'if len(x) > 0' — in Python just use 'if x:'
    fix: Replace 'if len(my_list) > 0:' with 'if my_list:'
    languages:
      python:
        ast:
          check: len_compare
        regex: '^\s*(?:el)?if\s+(?:not\s+)?len\s*\(\s*\w+\s*\)\s*(?:>\s*0|==\s*0|!=\s*0|>=\s*1)\s*:'
  - id: 30
    severity: LOW
    category: Best Practice
    message: Using type() for a type check — use isinstance() instead
    fix: Replace 'type(x) == int' with 'isinstance(x, int)' — it supports inheritance too
    languages:
      python:
        ast:
          check: type_compare
        regex: \btype\s*\([^)]*\)\s*[=!]=
  - id: 31
    severity: LOW
    category: Performance
    message: Building strings with + str(...) is clumsy and slow — use f-strings
    fix: 'Use an f-string: f''Hello {name}'' instead of ''Hello '' + str(name)'
    languages:
      python:
        ast:
          check: str_concat
        regex: \+\s*str\s*\(|\bstr\s*\([^()]*\)\s*\+
  - id: 32
    severity: LOW
    category: Performance
